[project]
name = "tweed"
version = "0.1.0"
description = "Grahame Bowland's library"
authors = [{ name = "Grahame Bowland", email = "grahame@oreamnos.com.au" }]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "lxml",
    "isbnlib",
]

[project.scripts]
tweed = "tweed.cli:main"

[dependency-groups]
dev = ["black"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tweed"]
